version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      react:
        patterns:
          - "react"
          - "react-dom"
      electron:
        patterns:
          - "electron"
          - "electron-builder"
      typescript-tooling:
        patterns:
          - "typescript"
          - "vitest"
          - "@types/*"
    ignore:
      # 설치본은 Windows 7 지원 때문에 Electron 22(Chromium 108)에 고정한다 — 메이저 업데이트는 받지 않는다.
      - dependency-name: "electron"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
