appId: com.wr-evaluation-unified.app
productName: 직업성 질환 통합 평가 프로그램
directories:
  output: release
files:
  - dist/electron/**/*
  - electron/**/*
  - public/**/*
  - ai-models.config.cjs
extraResources:
  - from: electron/emr-helper/bin/Release/EmrHelper.exe
    to: emr-helper/EmrHelper.exe
win:
  target:
    - target: nsis
      arch:
        - ia32
        - x64
  icon: public/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - ko
  language: "1042"
# publish는 명시적으로 null — 환경의 GH_TOKEN 등으로 electron-builder가 publish provider를
# 추론하지 않도록 못박는다(electron-builder.intranet.yml만 실제 generic publish를 덮어씀).
publish: null
